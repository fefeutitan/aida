spring:
  application:
    name: ${APP_NAME:aida}
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/aida}
    username: ${DB_USERNAME:aida}
    password: ${DB_PASSWORD:aida}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        enabled: ${OPENAI_CHAT_ENABLED:false}
      embedding:
        enabled: ${OPENAI_EMBEDDING_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
